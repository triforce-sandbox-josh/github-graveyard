# Triforce expert review. Runs only from the default branch (ADR-0001):
# pull_request_target, issue_comment and workflow_run never run workflow code from the PR.
# Do not add actions/checkout: Triforce reads the PR through the API and never runs PR code.
name: triforce

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [triforce-relay]
    types: [completed]

# GITHUB_TOKEN gets nothing. All API calls use the Triforce App's installation token.
permissions: {}

jobs:
  evaluate:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/triforce recheck')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review')
    # Below the `if`, so unrelated comments can't cancel or queue behind a real evaluation.
    # One queue per PR; never cancel, so the last event's evaluation always posts.
    concurrency:
      group: triforce-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    # The secrets live in this environment, restricted to the default branch, so no other
    # branch's workflow can read the App key or the Anthropic key. Create it before enabling.
    environment: triforce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint Triforce App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TRIFORCE_APP_ID }}
          private-key: ${{ secrets.TRIFORCE_APP_PRIVATE_KEY }}

      # Sandbox only: this fork is public and GitHub won't let a public repo use an action
      # from a private repo, so we check out our own (trusted) action code with a read-only
      # App token. This never checks out PR code. Private consumers use `uses: owner/triforce-review@v0`.
      - name: Mint read-only token for the action repo
        id: action-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TRIFORCE_APP_ID }}
          private-key: ${{ secrets.TRIFORCE_APP_PRIVATE_KEY }}
          owner: triforce-sandbox-josh
          repositories: triforce-review
          permission-contents: read

      - name: Check out the Triforce action
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: triforce-sandbox-josh/triforce-review
          ref: v0
          token: ${{ steps.action-token.outputs.token }}
          path: .triforce-action
          persist-credentials: false

      - name: Triforce Review
        uses: ./.triforce-action
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # dry-run posts a neutral risk card; enforce blocks until required approvals arrive.
          # Set the repo variable TRIFORCE_MODE=enforce once the risk cards look right.
          mode: ${{ vars.TRIFORCE_MODE || 'dry-run' }}
