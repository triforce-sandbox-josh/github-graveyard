# Triforce owners file. Reference: triforce-review docs/owners-reference.md.
version: 1

context: >
  Repo: github-graveyard, a Next.js 16 + TypeScript app. Enter a GitHub username,
  get a tombstone for each abandoned repo with a deterministic, joke "cause of death".
  There are no user accounts, logins or sessions. app/ holds routes: the landing page,
  /[username] graveyard, /[username]/[repo] single grave, /api/og/** share-card image
  routes, and POST /api/dig (dig counter). lib/github.ts calls the GitHub REST API with
  server tokens (GITHUB_TOKENS); lib/digs.ts writes a per-login counter to Firestore via
  firebase-admin (FIREBASE_SERVICE_ACCOUNT); lib/analytics.ts and components/Analytics.tsx
  send Firebase/GA4 events from the browser; lib/epitaphs.ts holds the cause-of-death jokes;
  lib/og.tsx renders share cards; components/ is shared UI; next.config.ts maps Firebase env
  vars into the browser bundle. Folders are hints only: route on what a change does.

roles:
  IE: { about: "Integrity Engineer: security, secrets, data egress, CI and test integrity." }
  SE: { about: "Systems Engineer: architecture, dependencies, build and runtime config." }
  PXA: { about: "Product Experience Architect: UI, design system, copy and UX." }

people:
  joshuayoes: { roles: [IE, SE], about: "Sandbox owner; security, CI and dependencies." }
  trevor-coleman: { roles: [IE], about: "Acting Integrity Engineer for the sandbox test (normally PXA)." }

domains:
  auth:
    description: >-
      Authentication, authorization, sessions and credentials that identify a caller.
      The app has no user login today; this covers adding one (OAuth "sign in with GitHub",
      cookies, sessions, middleware/proxy that gates routes) and how the server
      authenticates to GitHub or Firebase: choosing, rotating or attaching tokens and
      service-account credentials (GITHUB_TOKENS in lib/github.ts, FIREBASE_SERVICE_ACCOUNT
      in lib/digs.ts), and any admin-only or rate-limit bypass logic.
    examples:
      counts:
        - "Adding a 'Sign in with GitHub' button and an OAuth callback route"
        - "Changing how pickToken() selects or parses GITHUB_TOKENS, or sending the token to a non-GitHub host"
        - "Changing how the Firebase service account JSON is parsed or which credential initializeApp uses"
        - "Adding middleware/proxy that reads a cookie or header to allow or block requests"
        - "Letting a query param or header skip the 'real GitHub user' check in /api/dig"
      does_not_count:
        - "Restyling the dig form or the share buttons"
        - "Adding a new cause-of-death joke to lib/epitaphs.ts"
        - "Changing the USERNAME_RE display text or a tombstone layout"
    paths:
      - "**/auth/**"
      - "middleware.ts"
      - "proxy.ts"
    tier: high
    owners: [role:IE]

  dependencies:
    description: >-
      Adding, removing or upgrading npm packages, changing version ranges or the lockfile,
      registry or install configuration, and package scripts that run on install or build.
      Includes major framework bumps (next, react, firebase, firebase-admin, tailwindcss).
    examples:
      counts:
        - "Bumping next from 16.4.3 to 17 or firebase-admin to a new major"
        - "Adding an LLM SDK or any new runtime package"
        - "Adding a postinstall or prepare script, or a custom registry in .npmrc"
        - "Regenerating package-lock.json"
      does_not_count:
        - "Changing an import path inside app/ or lib/ without touching package.json"
        - "Editing the README's 'Run locally' instructions"
    paths:
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
    owners: [role:IE]

  ci-test-integrity:
    description: >-
      Anything that decides whether broken or unsafe code can ship: CI workflows, lint and
      type-check configuration, build and runtime config, and tests or test config. Covers
      weakening checks (disabling ESLint rules, adding ignores, loosening tsconfig strictness,
      skipping tests) and next.config.ts changes to build flags, caching, or which env vars
      are inlined into the client bundle.
    examples:
      counts:
        - "Adding a globalIgnores entry or turning off a rule in eslint.config.mjs"
        - "Setting strict: false or skipLibCheck in tsconfig.json"
        - "Adding a new env entry to next.config.ts that exposes a server variable to the browser"
        - "Adding a GitHub Actions workflow or changing the build/lint commands"
        - "Adding .skip to a test or lowering a coverage threshold"
      does_not_count:
        - "Fixing a lint error in a component by changing the component's code"
        - "Adding a new Tailwind class to a page"
    paths:
      - ".github/**"
      - "eslint.config.*"
      - "next.config.*"
      - "tsconfig.json"
      - "vitest.config.*"
      - "playwright.config.*"
    owners: [role:IE]

  data-privacy-egress:
    description: >-
      What data leaves the app, where it goes, and what is stored or logged about users.
      Outbound calls: the GitHub REST API (lib/github.ts), Firestore writes of dug-up logins
      (lib/digs.ts via app/api/dig/route.ts), Firebase/GA4 analytics events and their params
      (lib/analytics.ts, components/Analytics.tsx, data-track-* attributes such as item_id in
      components/ShareBar.tsx, the exception event in app/error.tsx), and the share-card
      warm-up fetches in lib/site.ts. Also covers secrets in env vars (GITHUB_TOKENS,
      FIREBASE_SERVICE_ACCOUNT, Firebase web config), console logging that could include
      tokens or request data, adding a new third-party script, LLM or API host, and changing
      what the dig counter stores beyond { login, count, lastDugAt }.
    examples:
      counts:
        - "Storing the visitor's IP, user agent or referrer alongside the dig in Firestore"
        - "Adding a new analytics event or a new data-track-* parameter with user-entered text"
        - "Sending repo names or descriptions to an LLM API to generate causes of death"
        - "Logging the full error object or request headers in app/api/dig/route.ts"
        - "Renaming a server-only env var to NEXT_PUBLIC_* so it ships to the browser"
        - "Adding a fetch to a new third-party host or embedding a new external script"
      does_not_count:
        - "Changing the wording of a tombstone or the rank names"
        - "Changing cacheLife duration for GitHub data without changing what is fetched"
        - "Restyling the PayRespects easter egg (it stores nothing)"
    paths:
      - "lib/github.ts"
      - "lib/digs.ts"
      - "lib/analytics.ts"
      - "components/Analytics.tsx"
      - "app/api/dig/**"
    tier: high
    owners: [role:IE]

  shared-ui:
    description: >-
      Shared components, global layout and global styles used across pages: tombstones,
      the grave grid, dig form, share bar, top bar, decorations and cursors, the root layout,
      and globals.css. Changes here affect every graveyard page and can break accessibility
      or layout broadly.
    examples:
      counts:
        - "Changing Tombstone props or markup used by every grave"
        - "Editing globals.css colors, fonts or animations"
        - "Changing the root layout's metadata, fonts or body structure"
        - "Removing keyboard focus styles or aria attributes from a shared button"
      does_not_count:
        - "Tweaking copy inside a single page's JSX in app/[username]/page.tsx"
        - "Changing which GitHub repos count as dead in lib/github.ts"
    paths:
      - "components/**"
      - "app/layout.tsx"
      - "app/globals.css"
    owners: [role:SE]

  payments:
    description: >-
      Money moving through the app. There is no payment code yet; this covers any future
      support, tip-jar, donation, sponsorship or billing feature: checkout or payment-link
      integrations (Stripe, GitHub Sponsors, Buy Me a Coffee, Ko-fi), webhooks that confirm
      payments, pricing or paywalls, receipts, and storing payer details.
    examples:
      counts:
        - "Adding a 'Buy me a coffee' or Stripe checkout link with an amount"
        - "Adding a webhook route that marks a supporter as paid"
        - "Gating premium share-card formats behind a purchase"
      does_not_count:
        - "The PayRespects 'press F' easter egg (no money involved)"
        - "The 'star this repo' card linking to GitHub"
    paths: []
    tier: high
    owners: [role:IE]

no_expert_needed:
  - "README.md"
  - "AGENTS.md"
  - "lib/epitaphs.ts"

always_human:
  paths:
    - ".github/workflows/**"
    - ".env*"
    - ".triforce/**"
  owners: [role:IE]

fallback_owners: [role:IE]

agents:
  branch_prefixes: ["claude/", "codex/", "copilot/"]
  escalate_tier: false
  max_low_risk_lines: 400

policy:
  self_approval: when_sole_owner
  rationale: nudge
